name: Security dependency lockfile (one-shot)
on:
  push:
    branches:
      - security/nextjs-supported-release-20261021
    paths:
      - .github/workflows/security-lockfile-one-shot.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Josh-Temple/Noema' && github.ref == 'refs/heads/security/nextjs-supported-release-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve security-patched dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert manifest and lockfile consistency
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          for (const name of ['next', 'react', 'react-dom']) {
            if (lock.packages[''].dependencies[name] !== pkg.dependencies[name]) throw new Error(name + ' root mismatch');
            if (lock.packages['node_modules/' + name].version !== pkg.dependencies[name]) throw new Error(name + ' installed mismatch');
          }
          console.log('Lockfile matches pinned runtime dependencies');
          NODE
      - name: Commit only lockfile to this security branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then echo 'No lockfile changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate patched dependency lockfile'
          git push origin HEAD:refs/heads/security/nextjs-supported-release-20261021
